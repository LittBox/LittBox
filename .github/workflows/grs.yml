name: Check profile artwork

on:
  push:
    paths:
      - README.md
      - .github/profile/**
      - .github/workflows/grs.yml
  pull_request:
    paths:
      - README.md
      - .github/profile/**
      - .github/workflows/grs.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate profile artwork
        run: python3 .github/profile/generate.py
      - name: Verify reproducible assets and valid SVG
        run: |
          git diff --exit-code -- .github/profile
          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET
          from html import unescape
          from urllib.parse import urlparse, parse_qs
          for path in Path('.github/profile').glob('*.svg'):
              root = ET.parse(path).getroot()
              assert root.tag == '{http://www.w3.org/2000/svg}svg', path
              for node in root.iter():
                  assert node.tag.rsplit('}', 1)[-1] not in {'script', 'foreignObject', 'linearGradient', 'radialGradient'}, path
          providers = {
              'komarev.com': '/ghpvc/',
              'readmestats.999857.xyz': '/api',
              'github-readme-stats-fast.vercel.app': '/api/top-langs',
              'github-profile-summary-cards.vercel.app': '/api/cards/profile-details',
          }
          found = set()
          for src in re.findall(r'<img[^>]+src="([^"]+)"', Path('README.md').read_text()):
              if src.startswith('./.github/profile/'):
                  assert Path(src).is_file(), src
              else:
                  url = urlparse(unescape(src))
                  if url.scheme == 'https' and url.hostname == 'img.shields.io':
                      query = parse_qs(url.query)
                      assert url.path == '/badge/dynamic/json', src
                      assert query.get('url') == ['https://api.github.com/users/LittBox'], src
                      assert query.get('query') == ['$.public_repos'], src
                      continue
                  assert url.scheme == 'https' and url.hostname in providers, src
                  assert url.path == providers[url.hostname], src
                  assert parse_qs(url.query).get('username') == ['LittBox'], src
                  found.add(url.hostname)
          assert found == set(providers), 'Preserve profile views, GitHub stats, languages, and activity graph.'
          print('Profile artwork, counter identity, and quantitative sections verified.')
          PY
